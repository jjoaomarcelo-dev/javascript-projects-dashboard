<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 12 — Meta de economia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="pagina">
        <header class="cabecalho">
            <a class="voltar-dashboard" href="../../index.html">← Voltar ao dashboard</a>
            <p class="numero-exercicio">Exercício 12</p>
            <h1>Meta de economia</h1>
            <p class="enunciado">Crie um acompanhamento de economia com meta de R$ 100 e saldo inicial de R$ 0.</p>
        </header>
        <section class="painel">
            <h2>Meta: R$ 100</h2>
            <label id="texto" for="valor">Valor para guardar (R$)</label>
            <input type="number" id="valor" placeholder="Ex.: 25" min="1" step="1" aria-describedby="ajudaValor">
            <p id="ajudaValor">Informe um valor inteiro maior que zero.</p>
            <div class="operacoes">
                <button id="bt1" type="button">Guardar valor</button>
                <button id="bt2" type="button" class="secundario">Reiniciar</button>
            </div>
            <div class="resumo-economia">
                <h2>Total guardado</h2>
                <p id="totalGuardado" class="resultado-item" aria-live="polite">R$ 0</p>
            </div>
            <p id="mensagem" aria-live="polite">Faltam R$ 100 para atingir sua meta</p>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
