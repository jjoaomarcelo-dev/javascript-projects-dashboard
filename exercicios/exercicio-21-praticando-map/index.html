<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 21 — Registro de notas com Map</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="cartao">
        <header class="cabecalho">
            <a class="voltar-dashboard" href="../../index.html">← Voltar ao dashboard</a>
            <p class="numero-exercicio">Exercício 21</p>
            <h1>Registro de notas</h1>
            <p class="enunciado">Cadastre, consulte, atualize e remova notas usando uma coleção Map.</p>
        </header>

        <section class="formulario" aria-labelledby="titulo-registro">
            <h2 id="titulo-registro">Aluno e nota</h2>

            <div class="campos">
                <div class="campo">
                    <label for="nomeAluno">Nome do aluno</label>
                    <input type="text" id="nomeAluno" placeholder="Ex.: Maria" autocomplete="off">
                </div>

                <div class="campo">
                    <label for="notaAluno">Nota</label>
                    <input type="number" id="notaAluno" min="0" max="10" step="0.1" placeholder="Ex.: 8.5">
                </div>
            </div>

            <button type="button" id="btnCadastrar">Cadastrar ou atualizar nota</button>

            <div class="acoes" aria-label="Ações do aluno">
                <button type="button" id="btnConsultar">Consultar nota</button>
                <button type="button" id="btnRemover" class="btn-remover">Remover aluno</button>
            </div>
        </section>

        <section class="resultado" aria-live="polite">
            <h2>Mensagem</h2>
            <p id="resultado">Use os campos acima para gerenciar as notas.</p>
        </section>

        <section class="lista-notas" aria-labelledby="titulo-lista-notas">
            <div class="lista-cabecalho">
                <h2 id="titulo-lista-notas">Notas cadastradas</h2>
                <p>Total: <strong id="totalAlunos">0</strong></p>
            </div>
            <div id="listaNotas">Nenhum aluno cadastrado.</div>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
